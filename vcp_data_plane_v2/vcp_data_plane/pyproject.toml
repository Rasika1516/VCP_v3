[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcp-data-plane"
version = "1.0.0"
description = "VCP Simulator — Simulation Data Plane: high-concurrency OCPP 1.6J/2.0.1 VCP worker runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # WebSocket runtime
    "websockets>=12.0",
    # Config & validation
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    # Worker local HTTP API & metrics
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    # Command/event bus (Redis Streams)
    "redis[hiredis]>=5.0",
    # CLI
    "click>=8.1",
    # Structured logging
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fakeredis>=2.21",
]
# Hardware-in-the-Loop adapters (opt-in)
hil = [
    "pymodbus>=3.6",
]

[project.scripts]
vcp-worker = "vcp_data_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
